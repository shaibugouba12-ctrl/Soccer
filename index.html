<!DOCTYPE html>
<html>
<head>
    <title>Soccer Penalty Shootout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>⚽ Soccer Penalty Shootout</h1>

    <div class="field">

        <div class="goal">
            🧤
        </div>

        <div class="player">
            🧍
        </div>

        <div class="ball">
            ⚽
        </div>

    </div>

    <p>Choose where to shoot!</p>

    <div class="buttons">
        <button id="left">⬅️ Left</button>
        <button id="center">⬆️ Center</button>
        <button id="right">Right ➡️</button>
    </div>

    <p id="result"></p>

    <p id="score">🏆 Score: 0</p>

    <button id="reset">🔄 Play Again</button>

    <script src="script.js"></script>

</body>
</html>
